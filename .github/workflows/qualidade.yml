name: Qualidade do site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-e-links:
    name: HTML válido e links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: docs/
          log_level: WARNING

      - name: Procurar links quebrados
        uses: lycheeverse/lychee-action@v2
        with:
          # Excluídos: LinkedIn, Instagram e WhatsApp bloqueiam robôs de verificação,
          # e o CV em PDF é enviado à parte (ver MANUTENCAO.md).
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,301,302,403
            --exclude linkedin[.]com
            --exclude instagram[.]com
            --exclude wa[.]me
            --exclude fonts[.]googleapis[.]com
            --exclude fonts[.]gstatic[.]com
            --exclude rodrigodionizio[.]github[.]io/meuportifolio
            --exclude rodrigo-dionizio-cv[.]pdf
            'docs/**/*.html'
          fail: true

  performance:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Subir o site
        run: npx --yes http-server ./docs -p 8080 --silent &

      - name: Aguardar o servidor
        run: npx --yes wait-on http://127.0.0.1:8080 --timeout 60000

      - name: Rodar Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:8080/
            http://127.0.0.1:8080/en/
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
